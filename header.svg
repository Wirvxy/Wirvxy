<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04070c"/><stop offset="1" stop-color="#071a10"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.45" r="0.55"><stop offset="0" stop-color="#00ff9c" stop-opacity="0.16"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00ff9c" stroke-opacity="0.07"/></pattern>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff9c" stop-opacity="0"/><stop offset="0.9" stop-color="#00ff9c" stop-opacity="0.22"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0.6"/></linearGradient>
<clipPath id="frame"><rect width="900" height="260" rx="16"/></clipPath>
<clipPath id="typing"><rect x="0" y="140" height="40" width="0"><animate attributeName="width" values="0;900;900;0" keyTimes="0;0.45;0.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<style>
.g1{fill:#00e5ff;opacity:0;animation:g1 3.5s infinite steps(1)}
.g2{fill:#ff2e63;opacity:0;animation:g2 3.5s infinite steps(1)}
.main{animation:jit 3.5s infinite steps(1)}
@keyframes g1{0%,86%{opacity:0;transform:translate(0,0)}88%{opacity:.85;transform:translate(-5px,2px)}91%{opacity:.85;transform:translate(4px,-1px)}94%{opacity:.6;transform:translate(-2px,1px)}97%,100%{opacity:0;transform:translate(0,0)}}
@keyframes g2{0%,86%{opacity:0;transform:translate(0,0)}88%{opacity:.85;transform:translate(5px,-2px)}91%{opacity:.85;transform:translate(-4px,2px)}94%{opacity:.6;transform:translate(3px,0)}97%,100%{opacity:0;transform:translate(0,0)}}
@keyframes jit{0%,87%{transform:translate(0,0)}89%{transform:translate(2px,0)}92%{transform:translate(-2px,0)}95%,100%{transform:translate(0,0)}}
.scan{animation:scan 5s linear infinite}
@keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(280px)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tag{opacity:.3;animation:pulse 4.5s infinite}
.t2{animation-delay:1.5s} .t3{animation-delay:3s}
@keyframes pulse{0%,100%{opacity:.3}10%,28%{opacity:1}38%{opacity:.3}}
</style>
<g clip-path="url(#frame)">
<rect width="900" height="260" fill="url(#bg)"/>
<rect width="900" height="260" fill="url(#grid)"/>
<rect width="900" height="260" fill="url(#glow)"/>
<rect class="scan" x="0" y="0" width="900" height="70" fill="url(#scan)"/>
</g>
<rect x="0.5" y="0.5" width="899" height="259" rx="16" fill="none" stroke="#00ff9c" stroke-opacity="0.35"/>
<g stroke="#00ff9c" stroke-width="2" fill="none" stroke-opacity="0.8">
<path d="M18 40V18H40"/><path d="M860 18H882V40"/><path d="M18 220V242H40"/><path d="M860 242H882V220"/>
</g>
<g font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace" font-size="13">
<circle cx="34" cy="34" r="0" />
<text x="30" y="38" fill="#00ff9c" fill-opacity="0.75">root@soc:~# ./identify --target monssif</text>
<text x="870" y="38" text-anchor="end" fill="#8b949e">STATUS: <tspan fill="#00ff9c">ONLINE</tspan></text>
<circle class="blink" cx="748" cy="33.5" r="4" fill="#00ff9c"/>
</g>
<g font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace" font-size="50" font-weight="800" letter-spacing="4" text-anchor="middle">
<text class="g1" x="450" y="118">MONSSIF EL HAOUARI</text>
<text class="g2" x="450" y="118">MONSSIF EL HAOUARI</text>
<text class="main" x="450" y="118" fill="#e6fff4">MONSSIF EL HAOUARI</text>
</g>
<g font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace" font-size="17" clip-path="url(#typing)">
<text x="174" y="164" fill="#c9d1d9"><tspan fill="#00ff9c">&gt; </tspan>Cybersecurity Engineering Student · <tspan fill="#00e5ff">Blue Team &amp; SOC</tspan><tspan class="blink" fill="#00ff9c"> █</tspan></text>
</g>
<g font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace" font-size="14" font-weight="700" text-anchor="middle">
<g class="tag"><rect x="243" y="196" width="120" height="30" rx="6" fill="#00ff9c" fill-opacity="0.08" stroke="#00ff9c"/><text x="303" y="216" fill="#00ff9c">[ DETECT ]</text></g>
<g class="tag t2"><rect x="380" y="196" width="140" height="30" rx="6" fill="#00e5ff" fill-opacity="0.08" stroke="#00e5ff"/><text x="450" y="216" fill="#00e5ff">[ INVESTIGATE ]</text></g>
<g class="tag t3"><rect x="537" y="196" width="120" height="30" rx="6" fill="#ff2e63" fill-opacity="0.08" stroke="#ff2e63"/><text x="597" y="216" fill="#ff2e63">[ RESPOND ]</text></g>
</g>
</svg>